services:
  postgres:
    image: postgres:15-alpine
    container_name: nest_db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-nest_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nest_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-nest_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  createbuckets:
    image: minio/mc
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://s3:9000 minioadmin minioadmin &&
      mc mb -p local/documents || true &&
      mc anonymous set download local/documents;
      exit 0;
      "
    networks:
      - nest_network

  s3:
    image: minio/minio:latest
    container_name: nest_object_storage
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nest_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nest_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - nest_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./my-doc-tracker-backend
      dockerfile: Dockerfile
    container_name: nest_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME: nest_db
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: development
    ports:
      - "3000:3000"
    networks:
      - nest_network
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./my-doc-tracker-frontend
      dockerfile: Dockerfile
    container_name: nest_frontend
    environment:
      PORT: 5173
      HOST: 0.0.0.0
      NODE_ENV: production
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    networks:
      - nest_network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  nest_network:
    driver: bridge

volumes:
  postgres_data:
    name: nest_postgres_data
  pgadmin_data:
    name: nest_pgadmin_data
  object_storage_data:
    name: nest_object_storage_data
